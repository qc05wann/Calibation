<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#059669"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>CalibTrack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;font-family:'Sarabun',system-ui,sans-serif;background:#f9fafb;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}
.app{display:flex;height:100dvh;width:100%}

/* Sidebar */
.sidebar{width:220px;background:linear-gradient(180deg,#064e3b 0%,#065f46 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden;z-index:20}
.sidebar.collapsed{width:60px}
.sidebar-brand{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.15);min-height:64px}
.sidebar-brand h1{font-size:18px;font-weight:700;white-space:nowrap;letter-spacing:-.5px}
.sidebar-brand .icon{font-size:24px;flex-shrink:0}
.sidebar-nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.7);font-size:14px;font-weight:500;white-space:nowrap;position:relative}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item .nav-icon{width:20px;text-align:center;flex-shrink:0;font-size:16px}
.nav-item .badge{position:absolute;right:8px;background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:99px;font-weight:700}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.15);font-size:11px;color:rgba(255,255,255,.4);text-align:center}
.sidebar-toggle{display:none;position:fixed;top:12px;left:12px;z-index:30;background:#065f46;color:#fff;border:none;border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 20px;display:flex;align-items:center;gap:12px;min-height:56px;flex-shrink:0}
.main-header h2{font-size:17px;font-weight:700;color:#1f2937}
.main-content{flex:1;overflow-y:auto;padding:16px 20px}

/* Cards */
.card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#6b7280;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.summary-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;text-align:center;transition:all .15s}
.summary-card:hover{border-color:#a7f3d0;transform:scale(1.01)}
.summary-card .num{font-size:28px;font-weight:700;line-height:1}
.summary-card .lbl{font-size:12px;color:#6b7280;margin-top:4px}
.summary-card.emerald .num{color:#059669}
.summary-card.red .num{color:#dc2626}
.summary-card.amber .num{color:#d97706}
.summary-card.blue .num{color:#2563eb}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid #e5e7eb;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;padding:8px 10px;text-align:left;font-weight:600;color:#4b5563;border-bottom:1px solid #e5e7eb;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:8px 10px;border-bottom:1px solid #f3f4f6;color:#374151;vertical-align:middle}
tr:hover td{background:#f0fdf4}
.badge-status{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-ok{background:#d1fae5;color:#065f46}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-over{background:#fee2e2;color:#991b1b}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:#059669;color:#fff}.btn-primary:hover{background:#047857}
.btn-secondary{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}.btn-secondary:hover{background:#e5e7eb}
.btn-danger{background:#fee2e2;color:#991b1b}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:6px;background:transparent;border:none;cursor:pointer;color:#6b7280;transition:all .15s}
.btn-icon:hover{background:#f3f4f6;color:#1f2937}

/* Search */
.search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:0 12px;flex:1;max-width:400px}
.search-bar input{border:none;outline:none;padding:8px 0;flex:1;font-size:13px;font-family:inherit;background:transparent}
.search-bar .icon{color:#9ca3af;font-size:14px}

/* Filters */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-chip{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#6b7280;transition:all .15s}
.filter-chip:hover{border-color:#a7f3d0}
.filter-chip.active{background:#059669;color:#fff;border-color:#059669}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;padding:24px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;color:#1f2937}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#4b5563;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#34d399}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* PIN Screen */
.pin-screen{position:fixed;inset:0;background:linear-gradient(135deg,#064e3b,#065f46 50%,#047857);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;color:#fff}
.pin-box{text-align:center}
.pin-box h1{font-size:28px;font-weight:700;margin-bottom:4px}
.pin-box p{color:rgba(255,255,255,.6);margin-bottom:24px;font-size:14px}
.pin-dots{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.pin-dot{width:12px;height:12px;border-radius:99px;border:2px solid rgba(255,255,255,.4);transition:all .2s}
.pin-dot.filled{background:#34d399;border-color:#34d399}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto}
.pin-key{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-family:inherit}
.pin-key:hover{background:rgba(255,255,255,.18)}
.pin-key:active{transform:scale(.93)}
.pin-key.empty{visibility:hidden}
.pin-key.backspace{font-size:16px}
.pin-msg{margin-top:16px;font-size:13px;min-height:20px}
.pin-msg.error{color:#fca5a5}

/* Annual Plan */
.plan-table{font-size:11px}
.plan-table th{padding:6px 8px;font-size:11px}
.plan-table td{padding:4px 6px;text-align:center}
.plan-dot{width:20px;height:20px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.plan-dot.due{background:#d1fae5;color:#065f46}
.plan-dot.overdue{background:#fee2e2;color:#991b1b}
.plan-dot.warn{background:#fef3c7;color:#92400e}

/* Alerts */
.alert-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;transition:all .15s}
.alert-item:hover{border-color:#fca5a5}
.alert-item.overdue{border-left:3px solid #ef4444}
.alert-item.soon{border-left:3px solid #f59e0b}
.alert-info{flex:1;min-width:0}
.alert-info .name{font-weight:600;font-size:14px;color:#1f2937}
.alert-info .detail{font-size:12px;color:#6b7280}
.alert-days{font-size:13px;font-weight:700;white-space:nowrap}
.alert-days.over-text{color:#dc2626}
.alert-days.warn-text{color:#d97706}

/* Settings */
.setting-section{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px}
.setting-section h4{font-size:14px;font-weight:700;color:#1f2937;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Cert upload */
.cert-zone{border:2px dashed #d1d5db;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all .15s;color:#6b7280;font-size:13px}
.cert-zone:hover{border-color:#34d399;background:#f0fdf4}
.cert-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cert-thumb{width:60px;height:60px;border-radius:6px;object-fit:cover;border:1px solid #e5e7eb}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:-220px;z-index:20;height:100dvh;transition:left .25s}
  .sidebar.open{left:0}
  .sidebar-toggle{display:flex;align-items:center;justify-content:center}
  .sidebar-overlay.show{display:block}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .form-row{grid-template-columns:1fr}
  .main-content{padding:12px}
  .main-header{padding:12px 12px 12px 56px}
}
@media(max-width:480px){
  .summary-grid{grid-template-columns:1fr 1fr}
  .pin-key{width:56px;height:56px;font-size:20px}
}

/* Print */
.export-section{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px}
.export-section h4{font-size:14px;font-weight:700;margin-bottom:12px}

/* Sync status */
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sync-dot.online{background:#34d399}
.sync-dot.offline{background:#f87171}
.sync-dot.syncing{background:#fbbf24;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Calendar View */
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cal-month{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.cal-month-head{background:#065f46;color:#fff;padding:8px;text-align:center;font-weight:600;font-size:14px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:10px;color:#6b7280;text-align:center;padding:4px 4px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);padding:4px;gap:2px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:4px;position:relative;cursor:default}
.cal-day.empty{visibility:hidden}
.cal-day.today{font-weight:700;border:1px solid #059669}
.cal-day.has-due{background:#d1fae5;color:#065f46;font-weight:600;cursor:pointer}
.cal-day.has-due:hover{background:#a7f3d0}
.cal-day.has-overdue{background:#fee2e2;color:#991b1b;font-weight:600;cursor:pointer}
.cal-day.has-overdue:hover{background:#fecaca}
.cal-day.has-warn{background:#fef3c7;color:#92400e;font-weight:600;cursor:pointer}
.cal-day.has-warn:hover{background:#fde68a}
.cal-day .dot-count{position:absolute;top:-2px;right:-2px;background:#059669;color:#fff;font-size:8px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-day.has-overdue .dot-count{background:#dc2626}
.cal-day.has-warn .dot-count{background:#d97706}
.cal-tooltip{position:fixed;background:#1f2937;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;z-index:60;max-width:280px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.view-toggle{display:inline-flex;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.view-toggle button{padding:6px 14px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:#fff;color:#6b7280;font-family:inherit;transition:all .15s}
.view-toggle button.active{background:#059669;color:#fff}
.view-toggle button:hover:not(.active){background:#f3f4f6}
@media(max-width:768px){.cal-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="icon">⚙️</span>
    <h1>CalibTrack</h1>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <div id="syncStatus"><span class="sync-dot syncing"></span>กำลังเชื่อมต่อ...</div>
    <div style="margin-top:4px">v3.0 · Firebase Edition</div>
  </div>
</aside>

<div class="main">
  <header class="main-header">
    <h2 id="pageTitle">รายการอุปกรณ์</h2>
    <div style="flex:1"></div>
    <button class="btn btn-sm btn-secondary" onclick="doLogout()" title="ออกจากระบบ">🔒 ล็อค</button>
  </header>
  <div class="main-content" id="mainContent"></div>
</div>
</div>

<!-- PIN Screen -->
<div class="pin-screen" id="pinScreen">
  <div class="pin-box">
    <div style="font-size:48px;margin-bottom:8px">⚙️</div>
    <h1>CalibTrack</h1>
    <p>กรอก PIN 8 หลัก เพื่อเข้าใช้งาน</p>
    <p style="font-size:11px;color:rgba(255,255,255,.35);margin-top:-16px;margin-bottom:20px">กดจากปุ่มด้านล่างหรือพิมพ์จากคีย์บอร์ดได้</p>
    <div class="pin-dots" id="pinDots"></div>
    <div class="pin-pad" id="pinPad"></div>
    <div class="pin-msg" id="pinMsg"></div>
    <div style="margin-top:24px"><a href="#" onclick="resetPIN(event)" style="color:rgba(255,255,255,.4);font-size:12px;text-decoration:underline">ลืม PIN? รีเซ็ตเป็น 12345678</a></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const LS_ITEMS = 'ct_items_v2';
const LS_PIN = 'ct_pin_v1';
const LS_SESSION = 'ct_session_v1';
const LS_SETTINGS = 'ct_settings_v1';

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyAB0aoBuGZZhUIW80_3GJ3Snn4GAtZ2e4c",
  authDomain: "calibation-aec01.firebaseapp.com",
  databaseURL: "https://calibation-aec01-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "calibation-aec01",
  storageBucket: "calibation-aec01.firebasestorage.app",
  messagingSenderId: "346549259919",
  appId: "1:346549259919:web:a7fed0b0ee70896b8e2afa"
};

let db = null;
let fbReady = false;
let unsubListener = null;

function initFirebase(){
  try {
    if(typeof firebase === 'undefined'){ 
      console.warn('Firebase SDK not loaded');
      fbReady = false;
      setSyncStatus('offline','ออฟไลน์ (ไม่พบ Firebase SDK)');
      return;
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    fbReady = true;
    setSyncStatus('online','Firebase เชื่อมต่อแล้ว');
    console.log('Firebase connected');
  } catch(e){
    console.error('Firebase init error:', e);
    fbReady = false;
    setSyncStatus('offline','ออฟไลน์: '+e.message);
  }
}

function setSyncStatus(state, text){
  const el = document.getElementById('syncStatus');
  if(el) el.innerHTML = `<span class="sync-dot ${state}"></span>${text}`;
}

// Strip large base64 cert data for Firestore (keep URLs and small data)
function toDocId(id){ return id.replace(/\//g, '__'); } // Firestore doesn't allow / in doc IDs
function fromDocId(docId){ return docId.replace(/__/g, '/'); }

function stripCertsForCloud(item){
  const clone = JSON.parse(JSON.stringify(item));
  // Keep cert count but strip large base64 to avoid 1MB doc limit
  if(clone.certs && clone.certs.length > 0){
    clone.certCount = clone.certs.length;
    clone.certs = clone.certs.map(c => {
      if(c && c.length > 200000) return '[[LOCAL]]'; // Flag as local-only
      return c; // Keep small certs
    });
  }
  // Same for calibHistory certs
  if(clone.calibHistory){
    clone.calibHistory = clone.calibHistory.map(h => {
      const hc = {...h};
      if(hc.certs) hc.certs = hc.certs.map(c => c && c.length > 200000 ? '[[LOCAL]]' : c);
      return hc;
    });
  }
  return clone;
}

// ===== FIRESTORE SYNC =====
async function saveItemsToCloud(){
  if(!fbReady || !db) return;
  setSyncStatus('syncing','กำลัง sync...');
  try {
    const batch = db.batch();
    const col = db.collection('equipments');
    
    // Get existing docs to find deletions
    const snapshot = await col.get();
    const existingDocIds = new Set();
    snapshot.forEach(doc => existingDocIds.add(doc.id));
    
    // Update/create items
    const currentDocIds = new Set();
    items.forEach(it => {
      const docId = toDocId(it.id);
      currentDocIds.add(docId);
      const ref = col.doc(docId);
      batch.set(ref, stripCertsForCloud(it));
    });
    
    // Delete removed items
    existingDocIds.forEach(docId => {
      if(!currentDocIds.has(docId)){
        batch.delete(col.doc(docId));
      }
    });
    
    await batch.commit();
    setSyncStatus('online','Sync สำเร็จ ✓');
  } catch(e){
    console.error('Cloud save error:', e);
    setSyncStatus('offline','Sync ผิดพลาด: '+(e.code||e.message||e));
  }
}

async function loadItemsFromCloud(){
  if(!fbReady || !db) return false;
  setSyncStatus('syncing','กำลังโหลด...');
  try {
    const snapshot = await db.collection('equipments').get();
    if(snapshot.empty) return false;
    
    const cloudItems = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      // Merge local certs back if cloud has [[LOCAL]] placeholders
      const localItem = items.find(i => i.id === data.id);
      if(data.certs){
        data.certs = data.certs.map((c, idx) => {
          if(c === '[[LOCAL]]' && localItem && localItem.certs && localItem.certs[idx]){
            return localItem.certs[idx];
          }
          return c === '[[LOCAL]]' ? null : c;
        }).filter(Boolean);
      }
      if(data.calibHistory){
        data.calibHistory.forEach((h, hi) => {
          if(h.certs){
            h.certs = h.certs.map((c, ci) => {
              if(c === '[[LOCAL]]' && localItem && localItem.calibHistory && localItem.calibHistory[hi]){
                return localItem.calibHistory[hi].certs?.[ci] || null;
              }
              return c === '[[LOCAL]]' ? null : c;
            }).filter(Boolean);
          }
        });
      }
      cloudItems.push(data);
    });
    
    items = cloudItems;
    items.forEach(it => { if(!it.certs) it.certs=[]; if(!it.category) it.category=''; if(!it.range) it.range=''; if(!it.resolution) it.resolution=''; if(!it.calibRange) it.calibRange=''; if(!it.tolerance) it.tolerance=''; if(!it.calibResult) it.calibResult=''; if(!it.docRef) it.docRef=''; if(!it.calibHistory) it.calibHistory=[]; });
    localStorage.setItem(LS_ITEMS, JSON.stringify(items));
    setSyncStatus('online','Firebase เชื่อมต่อแล้ว');
    return true;
  } catch(e){
    console.error('Cloud load error:', e);
    setSyncStatus('offline','โหลดไม่สำเร็จ: '+(e.code||e.message||e));
    return false;
  }
}

function startRealtimeSync(){
  if(!fbReady || !db) return;
  if(unsubListener) unsubListener();
  unsubListener = db.collection('equipments').onSnapshot(snapshot => {
    if(snapshot.metadata.hasPendingWrites) return; // Ignore local writes
    const cloudItems = [];
    snapshot.forEach(doc => cloudItems.push(doc.data()));
    if(cloudItems.length > 0){
      // Preserve local certs
      cloudItems.forEach(ci => {
        const local = items.find(i => i.id === ci.id);
        if(ci.certs) ci.certs = ci.certs.map((c,idx) => c === '[[LOCAL]]' && local?.certs?.[idx] ? local.certs[idx] : (c==='[[LOCAL]]'?null:c)).filter(Boolean);
        if(ci.calibHistory) ci.calibHistory.forEach((h,hi) => { if(h.certs) h.certs = h.certs.map((c,ci2) => c==='[[LOCAL]]'&&local?.calibHistory?.[hi]?.certs?.[ci2]?local.calibHistory[hi].certs[ci2]:(c==='[[LOCAL]]'?null:c)).filter(Boolean); });
      });
      items = cloudItems;
      items.forEach(it => { if(!it.certs) it.certs=[]; if(!it.category) it.category=''; if(!it.range) it.range=''; if(!it.resolution) it.resolution=''; if(!it.calibRange) it.calibRange=''; if(!it.tolerance) it.tolerance=''; if(!it.calibResult) it.calibResult=''; if(!it.docRef) it.docRef=''; if(!it.calibHistory) it.calibHistory=[]; });
      localStorage.setItem(LS_ITEMS, JSON.stringify(items));
      renderPage(); renderNav();
    }
    setSyncStatus('online','Firebase เชื่อมต่อแล้ว');
  }, err => {
    console.error('Realtime listener error:', err);
    setSyncStatus('offline','ขาดการเชื่อมต่อ: '+(err.code||err.message||err));
  });
}

function getNextCalib(item){
  if(!item.lastCalib) return null;
  const d = new Date(item.lastCalib);
  d.setMonth(d.getMonth() + (item.interval||12));
  return d;
}
function getDaysLeft(item){
  const next = getNextCalib(item);
  if(!next) return null;
  return Math.ceil((next - new Date()) / 86400000);
}
function getStatus(item){
  if(!item.lastCalib) return 'new';
  const days = getDaysLeft(item);
  if(days===null) return 'unknown';
  if(days<0) return 'overdue';
  if(days<=settings.alertDays) return 'soon';
  return 'ok';
}
function fmtDate(d){ if(!d) return '-'; const dt=new Date(d); return `${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()+543}`; }
function fmtDateISO(d){ if(!d) return ''; const dt=new Date(d); return dt.toISOString().split('T')[0]; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

function intervalLabel(m){
  if(m===1) return 'รายเดือน';
  if(m===3) return 'ราย 3 เดือน';
  if(m===6) return 'ปีละ 2 ครั้ง';
  if(m===12) return 'รายปี';
  if(m===24) return 'ราย 2 ปี';
  return `ทุก ${m} เดือน`;
}

// ===== PIN SYSTEM =====
const PIN_LENGTH = 8;
const PIN_DEFAULT = '12345678';
let pinInput = '';
let pinAttempts = 0;
let pinLocked = false;

function initPIN(){
  if(!localStorage.getItem(LS_PIN)) localStorage.setItem(LS_PIN, PIN_DEFAULT);
  const sess = sessionStorage.getItem(LS_SESSION);
  if(sess==='ok'){ document.getElementById('pinScreen').style.display='none'; return; }
  renderPIN();
  // Keyboard support
  document.addEventListener('keydown', handlePinKeyboard);
}

function handlePinKeyboard(e){
  const pinScreen = document.getElementById('pinScreen');
  if(!pinScreen || pinScreen.style.display==='none') return;
  if(e.key>='0' && e.key<='9'){ handlePinKey(parseInt(e.key)); }
  else if(e.key==='Backspace'){ handlePinKey('⌫'); }
  else if(e.key==='Enter' && pinInput.length===PIN_LENGTH){ checkPIN(); }
}

function renderPIN(){
  const dots = document.getElementById('pinDots');
  dots.innerHTML = Array.from({length:PIN_LENGTH},(_,i)=>`<div class="pin-dot ${i<pinInput.length?'filled':''}"></div>`).join('');
  
  const pad = document.getElementById('pinPad');
  pad.innerHTML = '';
  [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(k=>{
    const btn = document.createElement('button');
    btn.className = 'pin-key' + (k===''?' empty':'') + (k==='⌫'?' backspace':'');
    btn.textContent = k;
    btn.disabled = pinLocked;
    btn.onclick = () => handlePinKey(k);
    pad.appendChild(btn);
  });
}

function handlePinKey(k){
  if(pinLocked) return;
  if(k==='⌫'){ pinInput=pinInput.slice(0,-1); renderPIN(); return; }
  if(k==='') return;
  if(pinInput.length>=PIN_LENGTH) return;
  pinInput += String(k);
  renderPIN();
  if(pinInput.length===PIN_LENGTH){ checkPIN(); }
}

function checkPIN(){
  const stored = localStorage.getItem(LS_PIN)||PIN_DEFAULT;
  if(pinInput===stored){
    sessionStorage.setItem(LS_SESSION,'ok');
    document.getElementById('pinScreen').style.display='none';
    pinInput=''; pinAttempts=0;
  } else {
    pinAttempts++;
    const msg = document.getElementById('pinMsg');
    if(pinAttempts>=5){
      pinLocked=true;
      msg.textContent='ลองเกิน 5 ครั้ง — ลองใหม่ใน 30 วินาที';
      msg.className='pin-msg error';
      setTimeout(()=>{ pinLocked=false; pinAttempts=0; msg.textContent=''; renderPIN(); },30000);
    } else {
      msg.textContent=`PIN ไม่ถูกต้อง (${pinAttempts}/5)`;
      msg.className='pin-msg error';
      setTimeout(()=>{ msg.textContent=''; },2000);
    }
    pinInput='';
    renderPIN();
  }
}

function doLogout(){ sessionStorage.removeItem(LS_SESSION); pinInput=''; document.getElementById('pinScreen').style.display='flex'; renderPIN(); }

function resetPIN(e){
  e.preventDefault();
  if(confirm('รีเซ็ต PIN เป็น '+PIN_DEFAULT+' ?')){
    localStorage.setItem(LS_PIN, PIN_DEFAULT);
    pinInput=''; pinAttempts=0; pinLocked=false;
    savePinToCloud();
    document.getElementById('pinMsg').textContent='รีเซ็ตแล้ว — PIN ใหม่คือ '+PIN_DEFAULT;
    document.getElementById('pinMsg').className='pin-msg';
    document.getElementById('pinMsg').style.color='#6ee7b7';
    renderPIN();
  }
}

  nav.innerHTML = NAV_ITEMS.map(n=>{

  activePage=page;

  renderNav();
  renderPage();

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

  document.getElementById('sidebar').classList.toggle('open');

}

function renderPage(){
  const mc = document.getElementById('mainContent');

    case 'alerts': renderAlerts(mc); break;

    case 'settings': renderSettings(mc); break;
  }
}

// ===== ANNUAL PLAN =====
function isDueMonth(it, m, year){
  if(!it.lastCalib) return false;
  const base = new Date(it.lastCalib);
  for(let k=1;k<=24;k++){
    const check = new Date(base);
    check.setMonth(check.getMonth() + it.interval*k);
    if(check.getMonth()===m && check.getFullYear()===year) return true;
  }
  return false;
}

let tempCerts = [];

function handleCertUpload(e){
  const files = e.target.files;
  Array.from(files).forEach(f=>{
    if(f.size > 5*1024*1024){ toast('ไฟล์เกิน 5MB'); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      tempCerts.push(ev.target.result);
      const preview = document.getElementById('certPreview');
      if(preview){
        preview.innerHTML += `<div style="position:relative"><img src="${ev.target.result}" class="cert-thumb"/></div>`;
      }
    };
    reader.readAsDataURL(f);
  });
}

function removeCert(idx){
  if(editItem && editItem.certs){
    editItem.certs.splice(idx,1);
    saveItems();
    const preview = document.getElementById('certPreview');
    if(preview) preview.children[idx]?.remove();
  }
}

function saveItemForm(isEdit){
  const id = document.getElementById('mId').value.trim();
  const name = document.getElementById('mName').value.trim();
  if(!id||!name){ toast('กรุณากรอก รหัส และ ชื่อ'); return; }
  
  const data = {
    id, name,
    category: document.getElementById('mCategory').value.trim(),
    interval: parseInt(document.getElementById('mInterval').value),
    lastCalib: document.getElementById('mLastCalib').value,
    certs: isEdit ? (editItem.certs||[]).concat(tempCerts) : tempCerts.slice(),
    note: document.getElementById('mNote').value.trim(),
    range: document.getElementById('mRange').value.trim(),
    resolution: document.getElementById('mResolution').value.trim(),
    calibRange: document.getElementById('mCalibRange').value.trim(),
    tolerance: document.getElementById('mTolerance').value.trim(),
    calibResult: document.getElementById('mCalibResult').value.trim(),
    docRef: document.getElementById('mDocRef').value.trim()
  };

  if(isEdit){
    const idx = items.findIndex(i=>i.id===editItem.id);
    if(idx>=0) items[idx] = data;
  } else {
    if(items.find(i=>i.id===id)){ toast('รหัสซ้ำ!'); return; }
    items.push(data);
  }
  tempCerts = [];
  saveItems();
  closeModal();
  renderPage(); renderNav();
  toast(isEdit?'อัปเดตแล้ว ✓':'เพิ่มรายการแล้ว ✓');
}

function deleteItem(id){
  if(!confirm(`ลบรายการ ${id} ?`)) return;
  items = items.filter(i=>i.id!==id);
  saveItems(); renderPage(); renderNav();
  toast('ลบแล้ว');
}

function closeModal(){

      </div>

        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>

  `;

function handleImportFile(e){ if(e.target.files.length) processImportFile(e.target.files[0]); }

function processImportFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'binary',cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      
      if(rows.length===0){ toast('ไฟล์ว่าง'); return; }
      
      const mapped = rows.map(c => ({
        id: String(c.รหัส||c.ID||c.id||'').trim(),
        name: String(c.ชื่อ||c.ชื่ออุปกรณ์||c.Name||'').trim(),
        category: String(c.หมวด||c.ประเภท||c.Category||'').trim(),
        interval: parseInt(c.ความถี่||c.Interval||12)||12,
        lastCalib: c.สอบเทียบล่าสุด ? fmtDateISO(c.สอบเทียบล่าสุด) : (c.LastCalib||''),
        certs:[], note: String(c.หมายเหตุ||c.Note||'').trim(),
        range: String(c.พิกัด||c.Range||'').trim(),
        resolution: String(c.ความละเอียด||c.Resolution||'').trim(),
        calibRange: String(c['ช่วงการใช้งาน/ช่วงสอบเทียบ']||c.CalibRange||'').trim(),
        tolerance: String(c.ค่ายอมรับได้||c.Tolerance||'').trim(),
        calibResult: String(c.ผลการสอบเทียบ||c.CalibResult||'').trim(),
        docRef: String(c.เอกสารอ้างอิง||c.DocRef||'').trim()
      })).filter(c=>c.id && c.name);

      const preview = document.getElementById('importPreview');
      preview.innerHTML = `
        <p style="font-size:13px;font-weight:600">พบ ${mapped.length} รายการ</p>
        <p style="font-size:12px;color:#6b7280;margin-bottom:8px">ตัวอย่าง 5 รายการแรก:</p>
        <div class="tbl-wrap" style="max-height:200px;overflow-y:auto">
          <table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>หมวด</th><th>พิกัด</th></tr></thead>
          <tbody>${mapped.slice(0,5).map(r=>`<tr><td>${r.id}</td><td>${r.name}</td><td>${r.category}</td><td>${r.range}</td></tr>`).join('')}</tbody></table>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="doImport('merge')">✅ อัปเดตรายการที่ซ้ำ + เพิ่มใหม่</button>
          <button class="btn btn-danger btn-sm" onclick="doImport('replace')">🔄 แทนที่ทั้งหมดด้วยไฟล์ใหม่</button>
        </div>
      `;
      window._importData = mapped;
    } catch(err){ toast('อ่านไฟล์ไม่สำเร็จ: '+err.message); }
  };
  reader.readAsBinaryString(file);
}

function doImport(mode){
  const data = window._importData;
  if(!data) return;
  if(mode==='replace'){
    items = data;
  } else {
    data.forEach(d=>{
      const idx = items.findIndex(i=>i.id===d.id);
      if(idx>=0){ items[idx] = {...items[idx], ...d, certs: items[idx].certs||[] }; }
      else { items.push(d); }
    });
  }
  saveItems(); closeModal(); renderPage(); renderNav();
  toast(`Import สำเร็จ — ${data.length} รายการ`);
}

// ===== EXPORT FUNCTIONS =====
function makeExportRows(list){
  return list.map((it,i)=>{
    const next = getNextCalib(it);
    const days = getDaysLeft(it);
    const st = getStatus(it);
    return {
      'ลำดับ':i+1, 'รหัส':it.id, 'ชื่อ':it.name, 'หมวด':it.category||'',
      'สอบเทียบล่าสุด':it.lastCalib||'',
      'ความถี่':intervalLabel(it.interval),
      'ครบกำหนด':next?next.toISOString().split('T')[0]:'',
      'เหลือ/เกิน':days, 'Cert':it.docRef?'มี':'',
      'สถานะ':st==='new'?'ครั้งแรก':st==='overdue'?'เกินกำหนด':st==='soon'?'ใกล้ครบ':'ปกติ',
      'พิกัด':it.range||'', 'ความละเอียด':it.resolution||'',
      'ช่วงการใช้งาน/ช่วงสอบเทียบ':it.calibRange||'', 'ค่ายอมรับได้':it.tolerance||'',
      'ผลการสอบเทียบ':it.calibResult||'', 'เอกสารอ้างอิง':it.docRef||'', 'หมายเหตุ':it.note||''
    };
  });
}

function downloadXLSX(rows, filename, sheetName){
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName||'รายการอุปกรณ์');
  // Column widths matching the form template
  const FORM_WIDTHS = {'ลำดับ':6,'รหัส':16,'ชื่อ':50,'หมวด':34,'สอบเทียบล่าสุด':14,'ความถี่':7,'ครบกำหนด':11,'เหลือ/เกิน':9,'เหลือ/เกิน (วัน)':9,'Cert':5,'สถานะ':7,'พิกัด':21,'ความละเอียด':21,'ช่วงสอบเทียบ':25,'ช่วงการใช้งาน/ช่วงสอบเทียบ':25,'ค่ายอมรับได้':16,'ผลการสอบเทียบ':15,'เอกสาร Cert':12,'เอกสารอ้างอิง':15,'หมายเหตุ':15,'ม.ค.':5,'ก.พ.':5,'มี.ค.':5,'เม.ย.':5,'พ.ค.':5,'มิ.ย.':5,'ก.ค.':5,'ส.ค.':5,'ก.ย.':5,'ต.ค.':5,'พ.ย.':5,'ธ.ค.':5};
  const keys = Object.keys(rows[0]||{});
  ws['!cols'] = keys.map(k => ({wch: FORM_WIDTHS[k] || Math.max(k.length*2, 8)}));
  XLSX.writeFile(wb, filename);
}

function exportAll(){ downloadXLSX(makeExportRows(items), `CalibTrack_Report_${new Date().toISOString().split('T')[0]}.xlsx`, 'รายการอุปกรณ์'); toast('Export สำเร็จ ✓'); }
function exportOverdue(){ const list=items.filter(i=>getStatus(i)==='overdue'); if(!list.length){toast('ไม่มีรายการ');return;} downloadXLSX(makeExportRows(list),'CalibTrack_Overdue.xlsx','เกินกำหนด'); toast('Export สำเร็จ ✓'); }
function exportSoon(){ const list=items.filter(i=>getStatus(i)==='soon'); if(!list.length){toast('ไม่มีรายการ');return;} downloadXLSX(makeExportRows(list),'CalibTrack_DueSoon.xlsx','ใกล้ครบกำหนด'); toast('Export สำเร็จ ✓'); }

function exportAnnualPlan(){
  const year = new Date().getFullYear();
  const rows = items.map((it,idx)=>{
    const row = {
      'ลำดับ':idx+1,
      'รหัส':it.id,
      'ชื่อ':it.name,
      'หมวด':it.category||'',
      'พิกัด':it.range||'',
      'ความละเอียด':it.resolution||'',
      'ช่วงสอบเทียบ':it.calibRange||'',
      'ค่ายอมรับได้':it.tolerance||'',
      'ความถี่':intervalLabel(it.interval),
      'สอบเทียบล่าสุด':it.lastCalib||''
    };
    MONTHS_TH.forEach((m,mi)=>{ row[m] = isDueMonth(it,mi,year) ? '●' : ''; });
    row['ผลการสอบเทียบ'] = it.calibResult||'';
    row['เอกสาร Cert'] = it.docRef||'';
    row['หมายเหตุ'] = it.note||'';
    return row;
  });
  downloadXLSX(rows, `CalibPlan_${year+543}.xlsx`, 'แผนสอบเทียบประจำปี');
  toast('Export แผนสำเร็จ ✓');
}

function exportPlanRange(){
  const from = parseInt(document.getElementById('expFrom').value);
  const to = parseInt(document.getElementById('expTo').value);
  const year = new Date().getFullYear();
  const months = [];
  for(let i=from;i<=to;i++) months.push(i);
  
  const rows = items.map((it,idx)=>{
    const row = {
      'ลำดับ':idx+1,
      'รหัส':it.id,
      'ชื่อ':it.name,
      'หมวด':it.category||'',
      'พิกัด':it.range||'',
      'ความละเอียด':it.resolution||'',
      'ช่วงสอบเทียบ':it.calibRange||'',
      'ค่ายอมรับได้':it.tolerance||'',
      'ความถี่':intervalLabel(it.interval),
      'สอบเทียบล่าสุด':it.lastCalib||''
    };
    months.forEach(mi=>{ row[MONTHS_TH[mi]] = isDueMonth(it,mi,year) ? '●' : ''; });
    row['ผลการสอบเทียบ'] = it.calibResult||'';
    row['เอกสาร Cert'] = it.docRef||'';
    row['หมายเหตุ'] = it.note||'';
    return row;
  });
  downloadXLSX(rows, `CalibPlan_${MONTHS_TH[from]}-${MONTHS_TH[to]}_${year+543}.xlsx`, 'แผนสอบเทียบ');
  toast('Export แผนสำเร็จ ✓');
}

        <b>${it.id}</b> — ${it.name}<br>
        <span style="color:#6b7280">${it.category||'-'} · สอบเทียบล่าสุด: ${fmtDate(it.lastCalib)||'ยังไม่เคย'}</span>

      </div>
      <div class="form-row">
        <div class="form-group"><label>ช่วงการใช้งาน/สอบเทียบ</label><input id="hCalibRange" value="${it.calibRange||''}"/></div>

        <div class="form-group"><label>ผู้สอบเทียบ / บริษัท</label><input id="hOperator" value="" placeholder="ชื่อผู้สอบเทียบ"/></div>
      </div>
      <div class="form-group"><label>หมายเหตุ</label><textarea id="hNote" rows="2" placeholder="บันทึกเพิ่มเติม..."></textarea></div>
      <div class="form-group">
        <label>แนบใบ Cert</label>
        <div class="cert-zone" onclick="document.getElementById('hCertInput').click()">
          📁 คลิกเพื่อเลือกไฟล์ (JPG, PNG, PDF · สูงสุด 5MB)
          <input type="file" id="hCertInput" accept="image/*,.pdf" multiple style="display:none" onchange="handleHistCert(event)"/>
        </div>
        <div id="hCertPreview" class="cert-preview"></div>
      </div>
      <div style="background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:10px;margin-top:12px;font-size:12px;color:#92400e">

    </div>

function handleHistCert(e){
  Array.from(e.target.files).forEach(f=>{
    if(f.size>5*1024*1024){toast('ไฟล์เกิน 5MB');return;}
    const reader = new FileReader();
    reader.onload = ev => {
      window._histCerts.push(ev.target.result);
      const p = document.getElementById('hCertPreview');
      if(p) p.innerHTML += `<img src="${ev.target.result}" class="cert-thumb"/>`;
    };
    reader.readAsDataURL(f);
  });
}

function saveCalibration(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  const newDate = document.getElementById('hDate').value;
  const newResult = document.getElementById('hResult').value;
  if(!newDate){toast('กรุณาเลือกวันที่');return;}
  
  // Push current data to history (if has existing calibration)
  if(it.lastCalib){
    const histEntry = {
      date: it.lastCalib,
      result: it.calibResult||'',
      range: it.range||'',
      resolution: it.resolution||'',
      calibRange: it.calibRange||'',
      tolerance: it.tolerance||'',
      docRef: it.docRef||'',
      certs: it.certs||[],
      note: it.note||'',
      operator: '',
      recordedAt: new Date().toISOString()
    };
    if(!it.calibHistory) it.calibHistory=[];
    it.calibHistory.unshift(histEntry);
  }
  
  // Update current data with new calibration
  it.lastCalib = newDate;
  it.calibResult = newResult;
  it.range = document.getElementById('hRange').value.trim();
  it.resolution = document.getElementById('hResolution').value.trim();
  it.calibRange = document.getElementById('hCalibRange').value.trim();
  it.tolerance = document.getElementById('hTolerance').value.trim();
  it.docRef = document.getElementById('hDocRef').value.trim();
  it.note = document.getElementById('hNote').value.trim();
  it.certs = (window._histCerts||[]).slice();
  
  // Store operator in the CURRENT record so next time it moves to history
  it._lastOperator = document.getElementById('hOperator').value.trim();
  
  saveItems();
  closeModal();
  renderPage(); renderNav();
  toast(`บันทึกการสอบเทียบ ${id} สำเร็จ ✓`);
}

// ===== CLOUD SYNC HELPERS =====
async function forceSync(){
  if(!fbReady){toast('Firebase ไม่ได้เชื่อมต่อ');return;}
  setSyncStatus('syncing','กำลัง sync...');
  const loaded = await loadItemsFromCloud();
  await loadSettingsFromCloud();
  await loadPinFromCloud();
  if(loaded){
    renderPage(); renderNav();
    toast('Sync จาก Cloud สำเร็จ ✓');
  } else {
    toast('ไม่มีข้อมูลบน Cloud');
  }
}

async function uploadAllToCloud(){
  if(!fbReady){toast('Firebase ไม่ได้เชื่อมต่อ');return;}
  if(!confirm('อัพโหลดข้อมูลทั้งหมดจากเครื่องนี้ขึ้น Cloud? (จะทับข้อมูลบน Cloud)')) return;
  setSyncStatus('syncing','กำลังอัพโหลด...');
  await saveItemsToCloud();
  await saveSettingsToCloud();
  await savePinToCloud();
  toast(`อัพโหลด ${items.length} รายการขึ้น Cloud สำเร็จ ✓`);
}

// ===== INIT =====
async function init(){
  // 1. Load local data + show PIN pad IMMEDIATELY
  loadItems();
  loadSettings();
  initPIN();
  renderNav();
  renderPage();
  
  // 2. Firebase sync in background (won't block PIN screen)
  initFirebase();
  
  if(fbReady){
    try {
      // Load PIN from cloud - update if different
      const oldPin = localStorage.getItem(LS_PIN);
      await Promise.race([
        loadPinFromCloud(),
        new Promise((_,rej) => setTimeout(()=>rej('timeout'), 5000))
      ]).catch(()=> console.log('PIN cloud load timeout'));
      
      const newPin = localStorage.getItem(LS_PIN);
      if(oldPin !== newPin){ pinInput=''; renderPIN(); }
      
      // Load equipment data from cloud
      const cloudLoaded = await Promise.race([
        loadItemsFromCloud(),
        new Promise(resolve => setTimeout(()=>resolve(false), 10000))
      ]).catch(()=>false);
      
      await loadSettingsFromCloud().catch(()=>{});
      
      if(!cloudLoaded && items.length > 0){
        setSyncStatus('syncing','อัพโหลดข้อมูลเริ่มต้น...');
        await saveItemsToCloud().catch(()=>{});
        await saveSettingsToCloud().catch(()=>{});
        await savePinToCloud().catch(()=>{});
      }
      
      startRealtimeSync();
      renderNav();
      renderPage();
    } catch(e){
      console.error('Firebase sync error:', e);
      setSyncStatus('offline','Sync ผิดพลาด: '+(e.code||e.message||e));
    }
  }
}
init();
